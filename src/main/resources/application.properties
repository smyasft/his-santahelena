spring.application.name=his-santahelena
server.port=8080

# Cierre automatico de sesion por inactividad (RNF-02)
server.servlet.session.timeout=15m

# MongoDB: por defecto local. Para Atlas, define la variable MONGODB_URI (ver README).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/his_santahelena}
spring.data.mongodb.auto-index-creation=true

# Carga datos de ejemplo la primera vez (si la base esta vacia)
his.datos-demo=true

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Idioma y formato de fechas en espanol de Colombia
spring.web.locale=es_CO
spring.web.locale-resolver=fixed

# Listado oficial de medicamentos del INVIMA en datos.gov.co (API SODA, dataset i7cb-raxc)
his.cum.url=https://www.datos.gov.co/resource/i7cb-raxc.json
# Opcional: token gratuito de datos.gov.co para evitar limites de consultas (variable DATOS_GOV_TOKEN)
his.cum.token=${DATOS_GOV_TOKEN:}
