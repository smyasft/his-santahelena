<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error · HIS Santa Helena</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/his.css}">
</head>
<body style="display:grid;place-items:center;min-height:100vh">
<div class="panel" style="max-width:560px;width:92%">
    <div class="cab"><i class="bi bi-exclamation-triangle"></i> <span th:text="${'Error ' + (status != null ? status : '')}">Error</span></div>
    <div class="cuerpo">
        <p th:if="${status != null and status == 404}">La página solicitada no existe.</p>
        <p th:if="${status == null or status != 404}">Ocurrió un error al procesar la solicitud. Si persiste, informe al administrador con la hora del evento.</p>
        <p class="ayuda" th:text="${error}"></p>
        <a class="btn primario" th:href="@{/}"><i class="bi bi-house"></i> Ir al inicio</a>
    </div>
</div>
</body>
</html>
