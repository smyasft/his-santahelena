<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Fórmula médica</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/his.css}"></head>
<body class="doc">
<div th:replace="~{fragmentos :: barraDoc(${yo.tieneRol('PACIENTE') ? '/portal/formulas' : '/hce/historia/' + p.id})}"></div>
<div class="hoja">
    <div th:replace="~{fragmentos :: membrete('Fórmula médica')}"></div>
    <h2>Fórmula médica</h2>
    <table th:replace="~{fragmentos :: pacienteDoc(${p})}"></table>
    <table class="sinborde"><tr>
        <td><b>Fecha:</b> <span th:text="${#temporals.format(pr.fecha, 'dd/MM/yyyy HH:mm')}"></span></td>
        <td><b>Vigencia hasta:</b> <span th:text="${#temporals.format(pr.venceEn, 'dd/MM/yyyy')}"></span></td>
        <td><b>N.º</b> <span th:text="${pr.id}"></span></td></tr></table>
    <table style="margin-top:8px">
        <thead><tr><th>CUM</th><th>Medicamento</th><th>Dosis</th><th>Vía</th><th>Frecuencia</th><th class="num">Días</th><th class="num">Cantidad</th></tr></thead>
        <tbody>
        <tr th:each="it : ${pr.items}">
            <td th:text="${it.codigoCum}"></td>
            <td><span th:text="${it.nombre}"></span><b th:if="${it.controlEspecial}"> (CONTROL ESPECIAL)</b></td>
            <td th:text="${it.dosis}"></td><td th:text="${it.via}"></td><td th:text="${it.frecuencia}"></td>
            <td class="num" th:text="${it.dias}"></td><td class="num" th:text="${it.cantidad}"></td>
        </tr>
        </tbody>
    </table>
    <div class="firma-linea"><div th:text="${pr.medicoNombre + ' · ' + (pr.medicoRegistro != null ? pr.medicoRegistro : '')}"></div><div>Recibido por</div></div>
    <div class="nota" th:text="${'Firma electrónica: ' + pr.hashFirma}"></div>
</div>
<script th:src="@{/js/his.js}"></script>
</body>
</html>
