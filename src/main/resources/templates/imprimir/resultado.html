<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Resultado de laboratorio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/his.css}"></head>
<body class="doc">
<div th:replace="~{fragmentos :: barraDoc(${yo.tieneRol('PACIENTE') ? '/portal/resultados' : '/laboratorio/validados'})}"></div>
<div class="hoja">
    <div th:replace="~{fragmentos :: membrete('Laboratorio clínico')}"></div>
    <h2>Informe de resultados</h2>
    <table th:replace="~{fragmentos :: pacienteDoc(${p})}"></table>
    <table class="sinborde"><tr>
        <td><b>Muestra:</b> <span th:text="${o.codigoMuestra}"></span></td>
        <td><b>Toma:</b> <span th:text="${o.recibidaEn != null ? #temporals.format(o.recibidaEn, 'dd/MM/yyyy HH:mm') : ''}"></span></td>
        <td><b>Médico:</b> <span th:text="${o.medicoNombre}"></span></td></tr></table>
    <th:block th:each="e : ${o.examenes}">
        <h3 th:text="${e.codigo + ' · ' + e.nombre}"></h3>
        <table>
            <thead><tr><th>Analito</th><th class="num">Resultado</th><th>Unidad</th><th>Valores de referencia</th><th>Obs.</th></tr></thead>
            <tbody>
            <tr th:each="r : ${e.resultados}">
                <td th:text="${r.analito}"></td>
                <td class="num" th:classappend="${r.critico ? 'critico' : (r.fueraRango ? 'fuera' : '')}" th:text="${r.valor}"></td>
                <td th:text="${r.unidad}"></td><td th:text="${r.rango}"></td>
                <td th:text="${r.critico ? 'CRÍTICO' : (r.fueraRango ? 'Fuera de rango' : '')}"></td>
            </tr>
            </tbody>
        </table>
    </th:block>
    <div class="firma-linea"><div th:text="${'Validó: ' + (o.validadaPor != null ? o.validadaPor : '')}"></div><div th:text="${o.validadaEn != null ? 'Fecha de validación: ' + #temporals.format(o.validadaEn, 'dd/MM/yyyy HH:mm') : ''}"></div></div>
    <div class="nota">Los resultados deben ser interpretados por el médico tratante.</div>
</div>
<script th:src="@{/js/his.js}"></script>
</body>
</html>
